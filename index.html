<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calum</title>
  <style>
    :root {
      --bg: #2e78b5;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 65vh;
      /* Fade the bottom edge into the background so there's no visible border */
      -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
    }
    h1 { font-size: 1.8rem; margin: 20px 0 8px; }
    #datetime {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0 0 24px;
      font-variant-numeric: tabular-nums;
    }
    a.profile {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid var(--fg);
      color: var(--fg);
      text-decoration: none;
      font-weight: 600;
    }
    a.profile:hover, a.profile:focus-visible {
      background: var(--fg);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <main>
    <img src="profile.jpg" alt="Calum's profile picture">
    <h1>Calum</h1>
    <p id="datetime" aria-live="off">Loading date and time…</p>
    <a class="profile" href="https://github.com/calum" target="_blank" rel="noopener">View my GitHub profile</a>
  </main>

  <script>
    (function () {
      var el = document.getElementById('datetime');
      function update() {
        var now = new Date();
        var text = now.toLocaleString(undefined, {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        el.textContent = text;
      }
      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
