<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calum</title>
  <style>
    :root {
      --bg: #2e78b5;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
    }
    @font-face {
      font-family: "Myfont";
      src: url("fonts/Myfont-Regular.ttf") format("truetype");
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: "Myfont", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 65vh;
      /* Fade the bottom edge into the background so there's no visible border */
      -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
    }
    h1 { font-size: 1.8rem; margin: 0 0 8px; }
    a.profile {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid var(--fg);
      color: var(--fg);
      text-decoration: none;
      font-weight: 600;
    }
    a.profile:hover, a.profile:focus-visible {
      background: var(--fg);
      color: var(--bg);
    }
    /* Scoped to this list so the terminal-style font doesn't leak into other elements */
    .projects-heading { font-size: 1.2rem; margin: 32px 0 8px; }
    ul.projects {
      list-style: disc;
      padding-left: 20px;
      margin: 0;
      text-align: left;
      font-family: "Courier New", Courier, monospace;
    }
    ul.projects li + li { margin-top: 8px; }
    ul.projects a { color: var(--fg); background: #000; font-weight: bold; text-decoration: none; }
    @keyframes rainbow { 0.0% { color: #ff0000; } 14.3% { color: #00ff00; } 28.6% { color: #ffff00; } 42.9% { color: #0000ff; } 57.1% { color: #ff00ff; } 71.4% { color: #00ffff; } 85.7% { color: #ffffff; } }
    ul.projects a span { animation: rainbow 1.4s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { ul.projects a span { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Calum</h1>
    <img src="profile.jpg" alt="Calum's profile picture">
    <a class="profile" href="https://github.com/calum" target="_blank" rel="noopener">View my GitHub profile</a>
    <h2 class="projects-heading">Projects</h2>
    <ul class="projects">
      <li><a href="https://calum.github.io/terminal_graphics_api/" aria-label="TERMINAL GRAPHICS"><span style="animation-delay:-0s">T</span><span style="animation-delay:-0.2s">E</span><span style="animation-delay:-0.4s">R</span><span style="animation-delay:-0.6s">M</span><span style="animation-delay:-0.8s">I</span><span style="animation-delay:-1s">N</span><span style="animation-delay:-1.2s">A</span><span style="animation-delay:-1.4s">L</span> <span style="animation-delay:-1.8000001s">G</span><span style="animation-delay:-2s">R</span><span style="animation-delay:-2.2s">A</span><span style="animation-delay:-2.4s">P</span><span style="animation-delay:-2.6000001s">H</span><span style="animation-delay:-2.8s">I</span><span style="animation-delay:-3s">C</span><span style="animation-delay:-3.2s">S</span></a></li>
      <li><a href="https://calum.github.io/terminal_image_display/" aria-label="TERMAGE"><span style="animation-delay:-0s">T</span><span style="animation-delay:-0.2s">E</span><span style="animation-delay:-0.4s">R</span><span style="animation-delay:-0.6s">M</span><span style="animation-delay:-0.8s">A</span><span style="animation-delay:-1s">G</span><span style="animation-delay:-1.2s">E</span></a></li>
    </ul>
  </main>

</body>
</html>
